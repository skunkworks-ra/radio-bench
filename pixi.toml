[workspace]
name        = "radio-bench"
version     = "0.1.0"
description = "Harbor 2x2 ablation benchmark for radio interferometric reduction"
channels    = ["conda-forge"]
platforms   = ["linux-64"]

[dependencies]
python             = ">=3.12,<3.13"
pip                = ">=24"
importlib-metadata = ">=8.0,<9.0"
numpy              = ">=1.26"
astropy            = ">=6.0"
scipy              = ">=1.11"
pandas             = ">=2.1"
matplotlib-base    = ">=3.8"
pytest             = ">=8.0"
ruff               = ">=0.4"
docker-cli         = ">=24.0"
docker-compose     = ">=2.24"

[pypi-dependencies]
radio-bench    = { path = ".", editable = true }
harbor         = ">=0.20"
casatools      = "==6.7.6.14"
casatasks      = "==6.7.6.14"
pytest-asyncio = ">=0.23"
pyyaml         = ">=6.0"
pydantic       = ">=2.0"
httpx          = ">=0.27"
tomli-w        = ">=1.0"

[tasks]
podman-clean      = { cmd = "python -m radio_bench.podman_env --cleanup", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp", DOCKER_HOST = "unix:///run/user/1000/podman/podman.sock" } }
podman-check      = { cmd = "python -m radio_bench.podman_env", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp", MPLCONFIGDIR = "/mnt/fast/radio-bench/mplconfig", CASASITECONFIG = "/mnt/fast/radio-bench/casaconfig_local.py", DOCKER_HOST = "unix:///run/user/1000/podman/podman.sock" } }
podman-smoke-compose = { cmd = "python -m radio_bench.podman_env --smoke-compose", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp", DOCKER_CONFIG = "/mnt/fast/radio-bench/docker_config", DOCKER_HOST = "unix:///run/user/1000/podman/podman.sock" } }
build-images      = { cmd = "bash /home/pjaganna/Software/radio-bench/images/build_images.sh", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp", CONTAINER_TMPDIR = "/mnt/fast/radio_bench_data/podman_tmp", MPLCONFIGDIR = "/mnt/fast/radio-bench/mplconfig", CASASITECONFIG = "/mnt/fast/radio-bench/casaconfig_local.py", DOCKER_HOST = "unix:///run/user/1000/podman/podman.sock" } }
build-verifier    = { cmd = "bash /home/pjaganna/Software/radio-bench/images/build_images.sh --verifier-only --skip-smoke", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio_bench_data/podman_tmp" } }
build-synth       = { cmd = "python /home/pjaganna/Software/radio-bench/data_builders/build_synthetic_suite.py", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp", MPLCONFIGDIR = "/mnt/fast/radio-bench/mplconfig", CASASITECONFIG = "/mnt/fast/radio-bench/casaconfig_local.py" } }
build-checkpoints = { cmd = "python /home/pjaganna/Software/radio-bench/data_builders/build_3c391_checkpoints.py", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp", MPLCONFIGDIR = "/mnt/fast/radio-bench/mplconfig", CASASITECONFIG = "/mnt/fast/radio-bench/casaconfig_local.py" } }
export-skills     = { cmd = "python -m radio_bench.export_skills", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp", MPLCONFIGDIR = "/mnt/fast/radio-bench/mplconfig", CASASITECONFIG = "/mnt/fast/radio-bench/casaconfig_local.py" } }
build-tasks       = { cmd = "python -m radio_bench.build_tasks --skills-mode both --include-orchestrated", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp", MPLCONFIGDIR = "/mnt/fast/radio-bench/mplconfig", CASASITECONFIG = "/mnt/fast/radio-bench/casaconfig_local.py" } }
harbor-lint       = { cmd = "bash -c 'harbor lint /mnt/fast/radio-bench/tasks/*/'", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp", DOCKER_CONFIG = "/mnt/fast/radio-bench/docker_config" } }
oracle-synth      = { cmd = "harbor run --config /home/pjaganna/Software/radio-bench/jobs/oracle_synth.yaml", cwd = "/mnt/fast/radio-bench", depends-on = ["podman-check"], env = { TMPDIR = "/mnt/fast/radio-bench/tmp", DOCKER_CONFIG = "/mnt/fast/radio-bench/docker_config", DOCKER_HOST = "unix:///run/user/1000/podman/podman.sock" } }
oracle-3c391      = { cmd = "harbor run --config /home/pjaganna/Software/radio-bench/jobs/oracle_3c391.yaml", cwd = "/mnt/fast/radio-bench", depends-on = ["podman-check"], env = { TMPDIR = "/mnt/fast/radio-bench/tmp", DOCKER_CONFIG = "/mnt/fast/radio-bench/docker_config", DOCKER_HOST = "unix:///run/user/1000/podman/podman.sock" } }
analyze           = { cmd = "python -m radio_bench.analysis.cli", env = { TMPDIR = "/mnt/fast/radio-bench/tmp", MPLCONFIGDIR = "/mnt/fast/radio-bench/mplconfig", CASASITECONFIG = "/mnt/fast/radio-bench/casaconfig_local.py" } }

lint          = { cmd = "ruff check /home/pjaganna/Software/radio-bench/src /home/pjaganna/Software/radio-bench/data_builders /home/pjaganna/Software/radio-bench/task_specs /home/pjaganna/Software/radio-bench/images /home/pjaganna/Software/radio-bench/tests", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp" } }
fmt           = { cmd = "ruff format /home/pjaganna/Software/radio-bench/src /home/pjaganna/Software/radio-bench/data_builders /home/pjaganna/Software/radio-bench/task_specs /home/pjaganna/Software/radio-bench/images /home/pjaganna/Software/radio-bench/tests", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp" } }
fmt-check     = { cmd = "ruff format --check /home/pjaganna/Software/radio-bench/src /home/pjaganna/Software/radio-bench/data_builders /home/pjaganna/Software/radio-bench/task_specs /home/pjaganna/Software/radio-bench/images /home/pjaganna/Software/radio-bench/tests", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp" } }
check         = { cmd = "ruff check /home/pjaganna/Software/radio-bench/src /home/pjaganna/Software/radio-bench/data_builders /home/pjaganna/Software/radio-bench/task_specs /home/pjaganna/Software/radio-bench/images /home/pjaganna/Software/radio-bench/tests && ruff format --check /home/pjaganna/Software/radio-bench/src /home/pjaganna/Software/radio-bench/data_builders /home/pjaganna/Software/radio-bench/task_specs /home/pjaganna/Software/radio-bench/images /home/pjaganna/Software/radio-bench/tests", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp" } }

test          = { cmd = "pytest -c /home/pjaganna/Software/radio-bench/pyproject.toml --rootdir=/home/pjaganna/Software/radio-bench --basetemp=/mnt/fast/radio-bench/pytest /home/pjaganna/Software/radio-bench/tests -v", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp", MPLCONFIGDIR = "/mnt/fast/radio-bench/mplconfig", CASASITECONFIG = "/mnt/fast/radio-bench/casaconfig_local.py", DOCKER_CONFIG = "/mnt/fast/radio-bench/docker_config" } }
test-unit     = { cmd = "pytest -c /home/pjaganna/Software/radio-bench/pyproject.toml --rootdir=/home/pjaganna/Software/radio-bench --basetemp=/mnt/fast/radio-bench/pytest /home/pjaganna/Software/radio-bench/tests -v", cwd = "/mnt/fast/radio-bench", env = { TMPDIR = "/mnt/fast/radio-bench/tmp", MPLCONFIGDIR = "/mnt/fast/radio-bench/mplconfig", CASASITECONFIG = "/mnt/fast/radio-bench/casaconfig_local.py", DOCKER_CONFIG = "/mnt/fast/radio-bench/docker_config" } }
