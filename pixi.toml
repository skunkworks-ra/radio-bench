[workspace]
name        = "radio-bench"
version     = "0.1.0"
description = "Harbor 2x2 ablation benchmark for radio interferometric reduction"
channels    = ["conda-forge"]
platforms   = ["linux-64"]

[dependencies]
python             = ">=3.12,<3.13"
pip                = ">=24"
importlib-metadata = ">=8.0,<9.0"
numpy              = ">=1.26"
astropy            = ">=6.0"
scipy              = ">=1.11"
pandas             = ">=2.1"
matplotlib-base    = ">=3.8"
pytest             = ">=8.0"
ruff               = ">=0.4"
docker-cli         = ">=24.0"
docker-compose     = ">=2.24"

[pypi-dependencies]
radio-bench    = { path = ".", editable = true }
harbor         = ">=0.20"
casatools      = "==6.7.6.14"
casatasks      = "==6.7.6.14"
pytest-asyncio = ">=0.23"
pyyaml         = ">=6.0"
pydantic       = ">=2.0"
httpx          = ">=0.27"
tomli-w        = ">=1.0"

[tasks]
podman-clean         = "python -B -m radio_bench.cli podman-clean"
podman-check         = "python -B -m radio_bench.cli podman-check"
podman-smoke-compose = "python -B -m radio_bench.cli podman-smoke-compose"
build-images         = "python -B -m radio_bench.cli build-images"
build-verifier       = "python -B -m radio_bench.cli build-images --verifier-only --skip-smoke"
build-synth          = "python -B -m radio_bench.cli build-synth"
build-checkpoints    = "python -B -m radio_bench.cli build-checkpoints"
export-skills        = "python -B -m radio_bench.cli export-skills"
build-tasks          = "python -B -m radio_bench.cli build-tasks"
render-jobs          = "python -B -m radio_bench.cli render-jobs"
harbor-lint          = "python -B -m radio_bench.cli harbor-lint"
oracle               = "python -B -m radio_bench.cli run-oracle"
oracle-synth         = "python -B -m radio_bench.cli run-oracle --suite synth"
oracle-3c391         = "python -B -m radio_bench.cli run-oracle --suite 3c391"
analyze              = "python -B -m radio_bench.cli analyze"
diff-run             = "python -B -m radio_bench.cli diff-run"

lint      = "ruff check src data_builders task_specs suites images tests"
fmt       = "ruff format src data_builders task_specs suites images tests"
fmt-check = "ruff format --check src data_builders task_specs suites images tests"
check     = "ruff check src data_builders task_specs suites images tests && ruff format --check src data_builders task_specs suites images tests"

test      = "python -B -m radio_bench.cli test-unit"
test-unit = "python -B -m radio_bench.cli test-unit"
