[suite]
suite_id = "vla_snr_g55"
legacy_suite_alias = "vla_snr_g55"
split = "reference"
telescope = "VLA"
band = "L-band"
pol_basis = "circular"
description = "VLA D-configuration L-band 4-SPW wideband single-pointing widefield continuum of a supernova remnant"
category = "astronomy"
tags = ["radio-astronomy", "casa", "vla", "interferometry", "l-band", "wideband", "widefield"]

[roles]
flux_cal = ["0542+498=3C147"]
bandpass_cal = ["0542+498=3C147"]
phase_cal = ["J1925+2106"]
pol_angle_cal = []
pol_leakage_cal = []
targets = ["G55.7+3.4"]
dead_antennas = []
missing_stations = []
target_retention_excludes_dead_antenna = false

[geometry]
dish_diameter_m = 25.0
pb_mask_min = 0.20
offsource_inner_exclusion_beams = 5.0
phasecenter = "J2000 290.41666667deg 21.75deg"
off_source_min_radius_arcsec = 480.0

[geometry.verifier_tclean_recipe]
field = "G55.7+3.4"
spw = ""
phasecenter = "J2000 290.41666667deg 21.75deg"
specmode = "mfs"
gridder = "standard"
deconvolver = "hogbom"
imsize = [1280, 1280]
cell_arcsec = 8.0
weighting = "natural"
pblimit = 0.2
usemask = "user"
niter = 10000
nmajor = 4
threshold = "0mJy"
pbcor = true
off_source_min_radius_arcsec = 480.0
timeout_sec = 2400.0

[resources]
cpus = 8
verifier_cpus = 8
memory_mb = 16384
n_concurrent_trials = 1

[checkpoints]
builder = "build_vla_snr_g55:main"

[checkpoints.entries.raw]
input_ms = "casaguides/vla_snr_g55/raw/input.ms"

[checkpoints.entries.post_precal]
input_ms = "casaguides/vla_snr_g55/post_precal/input.ms"
