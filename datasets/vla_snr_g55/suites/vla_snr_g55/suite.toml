[checkpoints.entries.guide_calibrated]
input_ms = "casaguides/vla_snr_g55/guide_calibrated/input.ms"

[tasks.g1_g55_inspect]
stages = ["inspect"]
stage = "inspect"
checkpoint_in = "raw"
data_dir = "casaguides/vla_snr_g55/g1_g55_inspect"
input_ms = "casaguides/vla_snr_g55/raw/input.ms"
ground_truth = "casaguides/vla_snr_g55/g1_g55_inspect/ground_truth.json"
