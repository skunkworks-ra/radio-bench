job_name: suite_s_e2e_ablation
jobs_dir: /var/mnt/fast/radio_bench_runs
n_attempts: 3
n_concurrent_trials: 2
retry:
  max_retries: 2
  min_wait_sec: 5.0
  max_wait_sec: 60.0
  wait_multiplier: 2.0
environment:
  type: podman
  delete: true
agents:
- name: claude-code
  model_name: anthropic/claude-haiku-4-5
  kwargs:
    disable_web_search: true
- name: claude-code
  model_name: anthropic/claude-sonnet-4-6
  kwargs:
    disable_web_search: true
- name: opencode
  model_name: nrp/kimi
  base_url: https://ellm.nrp-nautilus.io/v1
  model_api_key_name: NRP_API_KEY
  model_api_format: openai_chat_completions
  kwargs:
    version: 1.19.5
    disable_web_search: true
- name: opencode
  model_name: nrp/glm-5
  base_url: https://ellm.nrp-nautilus.io/v1
  model_api_key_name: NRP_API_KEY
  model_api_format: openai_chat_completions
  kwargs:
    version: 1.19.5
    disable_web_search: true
tasks:
- path: /var/mnt/fast/radio-bench/tasks/s2_e2e_synth__00_none
- path: /var/mnt/fast/radio-bench/tasks/s2_e2e_synth__01_skills_raw
- path: /var/mnt/fast/radio-bench/tasks/s2_e2e_synth__01_skills_casa
- path: /var/mnt/fast/radio-bench/tasks/s2_e2e_synth__10_tools
- path: /var/mnt/fast/radio-bench/tasks/s2_e2e_synth__11_full
- path: /var/mnt/fast/radio-bench/tasks/s2_e2e_synth__11_orchestrated
